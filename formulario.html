<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Responder — Sondagem</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/sv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    // Porta a FillPage do React: uma pergunta por vez, lógica condicional real,
    // barra de progresso só com as perguntas alcançáveis e validação no campo.
    const slug = new URLSearchParams(window.location.search).get('slug') || '';

    let intro = true;
    let error = null;
    let viewed = false;
    let mounted = null;

    function surveyOf() {
      return Query.surveyBySlug(SV.get().surveys, slug);
    }

    function submitNow(survey) {
      const result = SVFilling.submit(survey);
      SV.registerResponse({
        surveyId: survey.id,
        answers: result.answers,
        durationSec: result.durationSec,
        completed: true,
        source: 'link',
      });
      window.location.href = 'obrigado.html?slug=' + encodeURIComponent(survey.slug);
    }

    function messageScreen(o) {
      const icon = UI.icon;
      return '<div class="mx-auto flex max-w-xl flex-col items-center px-4 py-24 text-center">' +
        '<span class="flex h-16 w-16 items-center justify-center rounded-2xl ' + o.tone + '">' + icon(o.icon, { size: 30 }) + '</span>' +
        '<h1 class="mt-6 text-xl font-semibold text-heading">' + o.title + '</h1>' +
        '<p class="mt-2 text-sm text-muted">' + o.desc + '</p>' +
        '<a href="' + o.href + '" class="mt-8 inline-flex h-11 items-center gap-2 rounded-xl bg-brand-500 px-5 text-sm font-medium text-white">' +
        icon(o.linkIcon, { size: 16 }) + o.link + '</a></div>';
    }

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, esc = UI.esc;
      const page = document.getElementById('page');
      const survey = surveyOf();

      if (!survey) {
        document.title = t('fill.notFoundTitle') + ' · ' + t('brand') + ' — Pesquisas & Formulários';
        page.innerHTML = messageScreen({
          tone: 'bg-brand-50 text-brand-500 dark:bg-brand-500/15',
          icon: 'clipboard-list',
          title: t('fill.notFoundTitle'),
          desc: t('fill.notFoundDesc'),
          href: 'index.html',
          linkIcon: 'arrow-right',
          link: t('fill.backHome'),
        });
        return;
      }

      document.title = survey.title + ' · ' + t('brand') + ' — Pesquisas & Formulários';

      if (survey.status !== 'publicado') {
        const closed = survey.status === 'encerrado';
        page.innerHTML = messageScreen({
          tone: 'bg-warning-50 text-warning-600 dark:bg-warning-500/15',
          icon: closed ? 'lock' : 'edit',
          title: t(closed ? 'fill.closedTitle' : 'fill.draftTitle'),
          desc: t(closed ? 'fill.closedDesc' : 'fill.draftDesc'),
          href: 'modelos.html',
          linkIcon: 'layers',
          link: t('fill.seeTemplates'),
        });
        return;
      }

      SVFilling.start(survey);
      if (!viewed) {
        viewed = true;
        SV.registerView(survey.id);
      }
      const filling = SVFilling.get();
      if (filling.slug === survey.slug && Object.keys(filling.answers).length > 0) intro = false;

      const questions = Query.ordered(survey.questions);
      const question = questions[filling.index];
      const progress = SVFilling.progress(survey);

      if (intro) {
        page.innerHTML =
          '<div class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 lg:py-16">' +
          '<div class="surface-card overflow-hidden rounded-3xl border shadow-theme-lg">' +
          '<img src="' + esc(Data.svImage(survey.coverSeed, 960, 420)) + '" alt="" class="h-40 w-full object-cover sm:h-56"/>' +
          '<div class="p-6 sm:p-8">' +
          '<h1 class="text-title-sm font-bold break-words text-heading">' + esc(survey.title) + '</h1>' +
          '<p class="mt-3 text-sm text-muted sm:text-base">' + esc(survey.description) + '</p>' +
          '<dl class="mt-6 flex flex-wrap gap-x-8 gap-y-3">' +
          '<div><dt class="text-xs text-muted">' + t('fill.questionsCount') + '</dt>' +
          '<dd class="text-sm font-semibold text-heading">' + questions.length + '</dd></div>' +
          '<div><dt class="text-xs text-muted">' + t('fill.estimated') + '</dt>' +
          '<dd class="text-sm font-semibold text-heading">' +
          t('fill.minutes', { count: Math.max(1, Math.round(questions.length * 0.6)) }) + '</dd></div>' +
          '<div><dt class="text-xs text-muted">' + t('fill.oneAtATime') + '</dt>' +
          '<dd class="text-sm font-semibold text-heading">' + t('fill.oneAtATimeValue') + '</dd></div></dl>' +
          '<button type="button" data-start class="mt-8 inline-flex h-12 w-full items-center justify-center gap-2 rounded-xl px-6 text-sm font-medium text-white transition sm:w-auto" style="background-color:' +
          esc(survey.color) + '">' + icon('play', { size: 18 }) + t('fill.start') + '</button>' +
          '</div></div></div>';
        page.querySelector('[data-start]').addEventListener('click', () => {
          intro = false;
          window.renderPage();
        });
        return;
      }

      const isLast = SVFilling.isLast(survey);

      const body = question
        ? '<div data-question-slot></div>' +
          '<div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">' +
          '<button type="button" data-back ' + (progress.current <= 1 ? 'disabled' : '') +
          ' class="inline-flex h-11 items-center justify-center gap-2 rounded-xl border border-themed px-5 text-sm font-medium text-body transition hover:bg-gray-50 disabled:opacity-40 dark:hover:bg-gray-800">' +
          icon('chevron-left', { size: 16 }) + t('common.back') + '</button>' +
          '<div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center">' +
          (!question.required
            ? '<button type="button" data-skip class="inline-flex h-11 items-center justify-center rounded-xl px-4 text-sm font-medium text-muted transition hover:text-heading">' +
              t('fill.skip') + '</button>'
            : '') +
          '<button type="button" data-next class="inline-flex h-11 items-center justify-center gap-2 rounded-xl px-6 text-sm font-medium text-white transition" style="background-color:' +
          esc(survey.color) + '">' + (isLast ? t('fill.submit') : t('common.next')) +
          icon(isLast ? 'send' : 'arrow-right', { size: 16 }) + '</button></div></div>'
        : '<div class="py-10 text-center"><p class="text-sm text-muted">' + t('fill.done') + '</p>' +
          '<button type="button" data-submit class="mt-6 inline-flex h-11 items-center gap-2 rounded-xl bg-brand-500 px-6 text-sm font-medium text-white">' +
          icon('send', { size: 16 }) + t('fill.submit') + '</button></div>';

      page.innerHTML =
        '<div class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 lg:py-16">' +
        '<div class="surface-card rounded-3xl border p-6 shadow-theme-lg sm:p-8">' +
        '<div class="mb-8">' + UI.progressBar(progress.current, progress.total, progress.percent, survey.color) + '</div>' +
        body +
        '<p class="mt-8 border-t border-themed pt-5 text-xs text-muted">' + t('fill.logicHint') + '</p>' +
        '</div></div>';

      if (question) {
        const slot = page.querySelector('[data-question-slot]');
        mounted = UI.mountQuestion(slot, {
          question: question,
          value: filling.answers[question.id],
          error: error,
          color: survey.color,
          onChange: (value) => {
            error = null;
            SVFilling.setAnswer(question.id, value);
          },
        });

        function handleNext() {
          const value = SVFilling.get().answers[question.id];
          const err = Query.validateAnswer(question, value);
          if (err) {
            error = err;
            mounted.setError(err);
            return;
          }
          error = null;
          if (SVFilling.isLast(survey)) return submitNow(survey);
          SVFilling.goNext(survey);
          window.renderPage();
        }

        page.querySelector('[data-back]').addEventListener('click', () => {
          error = null;
          SVFilling.goBack(survey);
          window.renderPage();
        });

        const skip = page.querySelector('[data-skip]');
        if (skip) {
          skip.addEventListener('click', () => {
            error = null;
            if (SVFilling.isLast(survey)) return handleNext();
            SVFilling.goNext(survey);
            window.renderPage();
          });
        }

        page.querySelector('[data-next]').addEventListener('click', handleNext);
      } else {
        page.querySelector('[data-submit]').addEventListener('click', () => submitNow(survey));
      }
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
