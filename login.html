<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Entrar na Sondagem</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/sv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="blank">
  <div id="app"><div id="page"></div></div>

  <script>
    // Porta a LoginPage do React. Autenticação fictícia: qualquer e-mail e senha
    // não vazios entram. A conta de demonstração já vem preenchida.
    let showPassword = false;
    let loading = false;
    let error = '';

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon;
      document.title = t('auth.loginTitle') + ' · ' + t('brand') + ' — Pesquisas & Formulários';

      const input =
        'h-11 w-full rounded-lg border border-themed bg-gray-50 text-sm text-body outline-none focus:border-brand-300 focus-ring dark:bg-gray-900';

      const form =
        '<form data-login class="space-y-5">' +
        '<div><label class="mb-2 block text-sm font-medium text-heading" for="email">' + t('auth.email') + '</label>' +
        '<div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">' +
        icon('mail', { size: 18 }) + '</span>' +
        '<input id="email" name="email" type="email" required value="' + Auth.DEMO_CREDENTIALS.email +
        '" placeholder="pesquisa@sondagem.com" class="' + input + ' pl-10 pr-3"/></div></div>' +
        '<div><label class="mb-2 block text-sm font-medium text-heading" for="password">' + t('auth.password') + '</label>' +
        '<div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">' +
        icon('lock', { size: 18 }) + '</span>' +
        '<input id="password" name="password" type="' + (showPassword ? 'text' : 'password') + '" required value="' +
        Auth.DEMO_CREDENTIALS.password + '" placeholder="••••••••" class="' + input + ' pl-10 pr-10"/>' +
        '<button type="button" data-toggle-password class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">' +
        icon(showPassword ? 'eye-off' : 'eye', { size: 18 }) + '</button></div></div>' +
        '<div class="flex items-center justify-between gap-3 text-sm">' +
        '<label class="flex items-center gap-2 text-body"><input type="checkbox" checked class="h-4 w-4 rounded border-themed accent-brand-500"/>' +
        t('auth.remember') + '</label>' +
        '<span class="font-medium text-brand-500">' + t('auth.forgot') + '</span></div>' +
        '<button type="submit" ' + (loading ? 'disabled' : '') +
        ' class="flex h-11 w-full items-center justify-center rounded-lg bg-brand-500 text-sm font-medium text-white shadow-theme-xs transition hover:bg-brand-600 focus-ring disabled:cursor-not-allowed disabled:opacity-60">' +
        (loading
          ? '<span class="flex items-center gap-2"><span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>' +
            t('auth.loggingIn') + '</span>'
          : t('auth.loginCta')) +
        '</button>' +
        (error
          ? '<p class="rounded-lg bg-error-50 px-4 py-2 text-center text-sm text-error-600 dark:bg-error-500/15 dark:text-error-500">' + error + '</p>'
          : '') +
        '</form>' +
        '<div class="mt-6 rounded-lg border border-dashed border-themed bg-gray-50/60 p-3 text-xs text-muted dark:bg-gray-900/40">' +
        '<p class="font-medium text-body">' + t('auth.demoTitle') + '</p>' +
        '<p>' + Auth.DEMO_CREDENTIALS.email + ' / ' + Auth.DEMO_CREDENTIALS.password + '</p>' +
        '<p class="mt-0.5">' + t('auth.demoHint') + '</p></div>';

      const footer =
        t('auth.noAccount') + ' <a href="registro.html" class="font-medium text-brand-500 hover:text-brand-600">' +
        t('auth.registerCta') + '</a>';

      const page = document.getElementById('page');
      page.innerHTML = UI.authShell(t('auth.loginTitle'), t('auth.loginSubtitle'), form, footer);

      page.querySelector('[data-toggle-password]').addEventListener('click', () => {
        showPassword = !showPassword;
        window.renderPage();
      });

      page.querySelector('[data-login]').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = e.target.email.value;
        const password = e.target.password.value;
        error = '';
        loading = true;
        window.renderPage();
        const ok = await Auth.login(email, password);
        loading = false;
        if (!ok) {
          error = t('auth.loginError');
          window.renderPage();
          return;
        }
        UI.notify(t('auth.loginSuccess'), 'success');
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = redirect || 'app.html';
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
