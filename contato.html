<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Fale com a gente — Sondagem</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/sv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    // Porta a ContactPage do React: formulário validado (mensagem embaixo do
    // campo) e os canais de atendimento ao lado.
    const CHANNELS = [
      { icon: 'mail', labelKey: 'contact.channels.email', value: 'contato@sondagem.com' },
      { icon: 'message-circle', labelKey: 'contact.channels.chat', value: 'Seg a sex, 9h às 18h' },
      { icon: 'clock', labelKey: 'contact.channels.sla', value: 'Resposta em até 1 dia útil' },
      { icon: 'globe', labelKey: 'contact.channels.status', value: 'status.sondagem.com' },
    ];
    const SUBJECTS = ['demo', 'plan', 'support', 'other'];
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, esc = UI.esc;
      document.title = t('contact.title') + ' · ' + t('brand') + ' — Pesquisas & Formulários';

      const control = 'focus-ring w-full rounded-lg border bg-transparent px-3.5 py-2.5 text-sm text-body placeholder:text-muted';

      const field = (name, label, inner, hint) =>
        '<div class="space-y-1.5"><label for="f-' + name + '" class="block text-sm font-medium text-heading">' + label + '</label>' +
        inner +
        '<p data-error="' + name + '" class="hidden text-xs text-error-500"></p>' +
        (hint ? '<p data-hint="' + name + '" class="text-xs text-muted">' + hint + '</p>' : '') +
        '</div>';

      const form =
        '<form data-contact class="space-y-5" novalidate>' +
        '<div class="grid gap-5 sm:grid-cols-2">' +
        field('name', t('contact.form.name'),
          '<input id="f-name" name="name" placeholder="Ana Martins" class="' + control + ' border-themed"/>') +
        field('email', t('contact.form.email'),
          '<input id="f-email" name="email" type="email" placeholder="ana@empresa.com" class="' + control + ' border-themed"/>') +
        '</div>' +
        field('subject', t('contact.form.subject'),
          '<select id="f-subject" name="subject" class="' + control + ' border-themed">' +
          '<option value="">' + t('contact.form.subjectPlaceholder') + '</option>' +
          SUBJECTS.map((s) => '<option value="' + s + '">' + t('contact.subjects.' + s) + '</option>').join('') +
          '</select>', t('contact.form.subjectHint')) +
        field('message', t('contact.form.message'),
          '<textarea id="f-message" name="message" rows="5" placeholder="' + esc(t('contact.form.messagePlaceholder')) +
          '" class="' + control + ' border-themed"></textarea>', t('contact.form.messageHint')) +
        '<button type="submit" class="inline-flex h-12 items-center gap-2 rounded-xl bg-brand-500 px-6 text-sm font-medium text-white transition hover:bg-brand-600 disabled:opacity-60">' +
        t('contact.form.submit') + icon('arrow-right', { size: 18 }) + '</button></form>';

      const aside =
        '<aside class="space-y-4 lg:col-span-2">' +
        CHANNELS.map((c) =>
          '<div class="surface-card flex gap-4 rounded-2xl border p-5">' +
          '<span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-500 dark:bg-brand-500/15">' +
          icon(c.icon, { size: 20 }) + '</span><div class="min-w-0">' +
          '<p class="text-xs tracking-wider text-muted uppercase">' + t(c.labelKey) + '</p>' +
          '<p class="mt-1 text-sm font-medium break-words text-heading">' + esc(c.value) + '</p></div></div>'
        ).join('') +
        '<div class="rounded-2xl border border-dashed border-themed p-5">' +
        '<p class="text-sm font-semibold text-heading">' + t('contact.tipTitle') + '</p>' +
        '<p class="mt-2 text-sm text-muted">' + t('contact.tipDesc') + '</p></div></aside>';

      const page = document.getElementById('page');
      page.innerHTML =
        '<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8 lg:py-16">' +
        '<header class="max-w-2xl">' +
        '<p class="text-sm font-semibold tracking-wider text-brand-500 uppercase">' + t('contact.eyebrow') + '</p>' +
        '<h1 class="mt-2 text-title-sm font-bold text-heading sm:text-title-md">' + t('contact.title') + '</h1>' +
        '<p class="mt-3 text-muted">' + t('contact.subtitle') + '</p></header>' +
        '<div class="mt-10 grid gap-8 lg:grid-cols-5"><div class="lg:col-span-3">' +
        '<div class="surface-card rounded-2xl border p-6 shadow-theme-sm md:p-8">' + form + '</div></div>' +
        aside + '</div></div>';

      const el = page.querySelector('[data-contact]');

      function setError(name, message) {
        const box = el.querySelector('[data-error="' + name + '"]');
        const hint = el.querySelector('[data-hint="' + name + '"]');
        const input = el.querySelector('[name="' + name + '"]');
        if (message) {
          box.textContent = message;
          box.classList.remove('hidden');
          if (hint) hint.classList.add('hidden');
          if (input) {
            input.classList.remove('border-themed');
            input.classList.add('border-error-500');
          }
        } else {
          box.textContent = '';
          box.classList.add('hidden');
          if (hint) hint.classList.remove('hidden');
          if (input) {
            input.classList.add('border-themed');
            input.classList.remove('border-error-500');
          }
        }
      }

      el.addEventListener('input', (e) => {
        if (e.target.name) setError(e.target.name, '');
      });

      el.addEventListener('submit', (e) => {
        e.preventDefault();
        const values = {
          name: el.name.value.trim(),
          email: el.email.value.trim(),
          message: el.message.value.trim(),
        };
        let valid = true;
        if (!values.name) { setError('name', t('validation.required')); valid = false; }
        if (!values.email) { setError('email', t('validation.required')); valid = false; }
        else if (!EMAIL_RE.test(values.email)) { setError('email', t('validation.email')); valid = false; }
        if (!values.message) { setError('message', t('validation.required')); valid = false; }
        else if (values.message.length < 10) { setError('message', t('validation.minChars', { count: 10 })); valid = false; }
        if (!valid) return;
        el.reset();
        UI.notify(t('contact.success'), 'success');
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
