<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Configurações — Sondagem</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/sv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="app">
  <div id="app"><div id="page"></div></div>

  <script>
    // Porta a SettingsPage do React: perfil, organização, notificações e
    // aparência (tema + idioma) com restauração dos dados de demonstração.
    const LABEL = 'mb-1.5 block text-sm font-medium text-heading';
    const CONTROL = 'focus-ring w-full rounded-lg border border-themed bg-transparent px-3.5 py-2.5 text-sm text-body';

    let tab = 0;
    const local = { weekly: true, closing: true, domain: 'sondagem.com' };

    function profileTab() {
      const t = UI.t, icon = UI.icon, esc = UI.esc;
      const user = Auth.getUser() || {};
      return '<div class="surface-card max-w-2xl rounded-2xl border p-5 md:p-6">' +
        '<h2 class="text-base font-semibold text-heading">' + t('settings.profile.title') + '</h2>' +
        '<div class="mt-5 grid gap-4 sm:grid-cols-2">' +
        '<div><label class="' + LABEL + '" for="p-name">' + t('settings.profile.name') + '</label>' +
        '<input id="p-name" value="' + esc(user.name || '') + '" class="' + CONTROL + '"/></div>' +
        '<div><label class="' + LABEL + '" for="p-email">' + t('settings.profile.email') + '</label>' +
        '<input id="p-email" type="email" value="' + esc(user.email || '') + '" class="' + CONTROL + '"/></div>' +
        '<div class="sm:col-span-2"><label class="' + LABEL + '" for="p-role">' + t('settings.profile.role') + '</label>' +
        '<input id="p-role" value="' + esc(user.role || '') + '" class="' + CONTROL + '"/></div></div>' +
        '<button type="button" data-save-profile class="mt-5 inline-flex h-10 items-center gap-2 rounded-lg bg-brand-500 px-4 text-sm font-medium text-white transition hover:bg-brand-600">' +
        icon('check', { size: 16 }) + t('common.save') + '</button></div>';
    }

    function orgTab() {
      const t = UI.t, icon = UI.icon, esc = UI.esc;
      const user = Auth.getUser() || {};
      return '<div class="surface-card max-w-2xl rounded-2xl border p-5 md:p-6">' +
        '<h2 class="text-base font-semibold text-heading">' + t('settings.org.title') + '</h2>' +
        '<div class="mt-5 grid gap-4 sm:grid-cols-2">' +
        '<div><label class="' + LABEL + '" for="o-name">' + t('settings.org.name') + '</label>' +
        '<input id="o-name" value="' + esc(user.organization === undefined || user.organization === null ? 'Sondagem' : user.organization) + '" class="' + CONTROL + '"/></div>' +
        '<div><label class="' + LABEL + '" for="o-domain">' + t('settings.org.domain') + '</label>' +
        '<input id="o-domain" value="' + esc(local.domain) + '" class="' + CONTROL + '"/></div></div>' +
        '<p class="mt-3 text-xs text-muted">' + t('settings.org.domainHint') + '</p>' +
        '<button type="button" data-save-org class="mt-5 inline-flex h-10 items-center gap-2 rounded-lg bg-brand-500 px-4 text-sm font-medium text-white transition hover:bg-brand-600">' +
        icon('check', { size: 16 }) + t('common.save') + '</button></div>';
    }

    function notificationsTab() {
      const t = UI.t;
      const ui = UIState.get();
      const items = [
        { key: 'response', value: ui.notifyOnResponse },
        { key: 'weekly', value: local.weekly },
        { key: 'closing', value: local.closing },
      ];
      return '<div class="surface-card max-w-2xl rounded-2xl border p-5 md:p-6">' +
        '<h2 class="text-base font-semibold text-heading">' + t('settings.notifications.title') + '</h2>' +
        '<ul class="mt-5 flex flex-col gap-3">' +
        items.map((item) =>
          '<li class="flex items-center justify-between gap-4 rounded-xl border border-themed px-4 py-3"><div class="min-w-0">' +
          '<p class="text-sm font-medium text-heading">' + t('settings.notifications.' + item.key) + '</p>' +
          '<p class="text-xs text-muted">' + t('settings.notifications.' + item.key + 'Desc') + '</p></div>' +
          UI.switchToggle(item.value, 'data-notify="' + item.key + '"') + '</li>'
        ).join('') +
        '</ul></div>';
    }

    function appearanceTab() {
      const t = UI.t, icon = UI.icon;
      const ui = UIState.get();
      return '<div class="flex max-w-2xl flex-col gap-6">' +
        '<div class="surface-card rounded-2xl border p-5 md:p-6">' +
        '<h2 class="text-base font-semibold text-heading">' + t('settings.tabs.appearance') + '</h2>' +
        '<div class="mt-5 flex items-center justify-between gap-4 rounded-xl border border-themed px-4 py-3"><div class="min-w-0">' +
        '<p class="text-sm font-medium text-heading">' + t('settings.appearance.dark') + '</p>' +
        '<p class="text-xs text-muted">' + t('settings.appearance.darkDesc') + '</p></div>' +
        UI.switchToggle(ui.darkMode, 'data-toggle-theme') + '</div>' +
        '<div class="mt-5"><label class="' + LABEL + '" for="lang">' + t('settings.appearance.language') + '</label>' +
        '<select id="lang" class="' + CONTROL + '">' +
        I18n.LANGUAGES.map((l) => '<option value="' + l.code + '" ' + (l.code === UI.lang() ? 'selected' : '') + '>' + l.flag + ' ' + l.label + '</option>').join('') +
        '</select><p class="mt-1.5 text-xs text-muted">' + t('settings.appearance.languageHint') + '</p></div></div>' +
        '<div class="rounded-2xl border border-dashed border-themed p-5 md:p-6">' +
        '<h2 class="text-base font-semibold text-heading">' + t('settings.reset.title') + '</h2>' +
        '<p class="mt-1 text-sm text-muted">' + t('settings.reset.desc') + '</p>' +
        '<button type="button" data-reset class="mt-4 inline-flex h-10 items-center gap-2 rounded-lg border border-themed px-4 text-sm font-medium text-body transition hover:bg-gray-50 dark:hover:bg-gray-800">' +
        icon('refresh-cw', { size: 16 }) + t('settings.reset.action') + '</button></div></div>';
    }

    function renderTab() {
      const t = UI.t;
      const panel = document.querySelector('[data-tab-panel]');
      if (!panel) return;
      panel.innerHTML = [profileTab, orgTab, notificationsTab, appearanceTab][tab]();

      document.querySelectorAll('[data-tabs] [data-tab]').forEach((btn, i) => {
        const active = i === tab;
        btn.setAttribute('aria-selected', String(active));
        btn.className =
          '-mb-px inline-flex items-center gap-2 whitespace-nowrap border-b-2 px-4 py-2.5 text-sm font-medium transition ' +
          (active
            ? 'border-brand-500 text-brand-600 dark:text-brand-400'
            : 'border-transparent text-muted hover:border-gray-300 hover:text-body dark:hover:border-gray-700');
      });

      const saveProfile = panel.querySelector('[data-save-profile]');
      if (saveProfile) saveProfile.addEventListener('click', () => {
        Auth.updateProfile({
          name: document.getElementById('p-name').value,
          email: document.getElementById('p-email').value,
          role: document.getElementById('p-role').value,
        });
        UI.notify(t('settings.profile.saved'), 'success');
        Layout.updateTopbar();
      });

      const saveOrg = panel.querySelector('[data-save-org]');
      if (saveOrg) saveOrg.addEventListener('click', () => {
        local.domain = document.getElementById('o-domain').value;
        Auth.updateProfile({ organization: document.getElementById('o-name').value });
        UI.notify(t('settings.org.saved'), 'success');
      });

      panel.querySelectorAll('[data-notify]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-notify');
          if (key === 'response') {
            UIState.setNotifyOnResponse(!UIState.get().notifyOnResponse);
            UI.notify(t('settings.saved'), 'success');
          } else {
            local[key] = !local[key];
          }
          renderTab();
        })
      );

      const theme = panel.querySelector('[data-toggle-theme]');
      if (theme) theme.addEventListener('click', () => {
        UIState.setDarkMode(!UIState.get().darkMode);
        Layout.updateTopbar();
        renderTab();
      });

      const langSelect = panel.querySelector('#lang');
      if (langSelect) langSelect.addEventListener('change', (e) => I18n.setLang(e.target.value));

      const reset = panel.querySelector('[data-reset]');
      if (reset) reset.addEventListener('click', () => {
        SV.reset();
        UI.notify(t('settings.reset.done'), 'success');
      });
    }

    window.onTabChange = function (index) {
      tab = index;
      renderTab();
    };

    window.renderPage = function () {
      const t = UI.t;
      document.title = t('settings.title') + ' · ' + t('brand') + ' — Pesquisas & Formulários';

      document.getElementById('page').innerHTML =
        UI.pageHeader({ title: t('settings.title'), subtitle: t('settings.subtitle') }) +
        UI.tabs(
          [
            { label: t('settings.tabs.profile'), icon: 'user', content: '' },
            { label: t('settings.tabs.org'), icon: 'briefcase', content: '' },
            { label: t('settings.tabs.notifications'), icon: 'bell', content: '' },
            { label: t('settings.tabs.appearance'), icon: 'palette', content: '' },
          ],
          tab
        );

      renderTab();
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
