<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Sondagem — Pesquisas & Formulários</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <script src="assets/js/state.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/query.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/sv.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
</head>
<body data-shell="public">
  <div id="app"><div id="page"></div></div>

  <script>
    // Porta a HomePage do React: hero, tipos de pergunta, como funciona,
    // modelos prontos, depoimentos, planos e FAQ.
    const STEPS = ['build', 'share', 'read'];
    const FAQ_ITEMS = ['logic', 'export', 'brand', 'limits', 'privacy'];
    let openFaq = 'logic';

    window.renderPage = function () {
      const t = UI.t, icon = UI.icon, esc = UI.esc;
      const st = SV.get();
      const surveys = st.surveys, responses = st.responses, templates = st.templates;

      document.title = t('brand') + ' — Pesquisas & Formulários';

      const published = surveys.filter((s) => s.status === 'publicado');
      const highlight = Query.surveyStats(published, responses).sort((a, b) => b.responses - a.responses)[0];

      const hero =
        '<section class="relative overflow-hidden border-b border-themed">' +
        '<div class="pointer-events-none absolute inset-x-0 -top-40 h-96 bg-brand-500/10 blur-3xl"></div>' +
        '<div class="relative mx-auto grid max-w-7xl gap-10 px-4 py-16 sm:px-6 lg:grid-cols-2 lg:items-center lg:px-8 lg:py-24">' +
        '<div class="min-w-0">' +
        '<span class="inline-flex items-center gap-2 rounded-full border border-themed px-3 py-1 text-xs font-medium text-muted">' +
        '<span class="h-1.5 w-1.5 rounded-full bg-success-500"></span>' +
        t('home.hero.badge', { total: UI.fmtNumber(responses.length) }) + '</span>' +
        '<h1 class="mt-5 text-title-sm font-bold text-heading sm:text-title-md">' + t('home.hero.title') + '</h1>' +
        '<p class="mt-4 max-w-xl text-base text-muted sm:text-lg">' + t('home.hero.subtitle') + '</p>' +
        '<div class="mt-8 flex flex-wrap gap-3">' +
        '<a href="' + (highlight ? 'formulario.html?slug=' + encodeURIComponent(highlight.survey.slug) : 'modelos.html') +
        '" class="inline-flex h-12 items-center gap-2 rounded-xl bg-brand-500 px-6 text-sm font-medium text-white transition hover:bg-brand-600">' +
        icon('play', { size: 18 }) + t('home.hero.tryForm') + '</a>' +
        '<a href="modelos.html" class="inline-flex h-12 items-center gap-2 rounded-xl border border-themed px-6 text-sm font-medium text-body transition hover:bg-gray-50 dark:hover:bg-gray-800">' +
        icon('layers', { size: 18 }) + t('home.hero.seeTemplates') + '</a></div>' +
        '<dl class="mt-10 grid max-w-md grid-cols-3 gap-4">' +
        '<div class="min-w-0"><dt class="truncate text-xs text-muted">' + t('home.hero.statForms') + '</dt>' +
        '<dd class="text-title-sm font-bold text-heading">' + surveys.length + '</dd></div>' +
        '<div class="min-w-0"><dt class="truncate text-xs text-muted">' + t('home.hero.statResponses') + '</dt>' +
        '<dd class="text-title-sm font-bold text-heading">' + responses.length + '</dd></div>' +
        '<div class="min-w-0"><dt class="truncate text-xs text-muted">' + t('home.hero.statTypes') + '</dt>' +
        '<dd class="text-title-sm font-bold text-heading">' + Data.QUESTION_TYPES.length + '</dd></div></dl>' +
        '</div>' +
        '<div class="relative min-w-0"><div class="surface-card overflow-hidden rounded-3xl border shadow-theme-xl">' +
        '<img src="' + esc(Data.svImage('hero-sondagem', 960, 640)) + '" alt="" class="h-52 w-full object-cover sm:h-64" loading="eager"/>' +
        '<div class="p-6"><p class="text-xs font-medium tracking-wide text-brand-500 uppercase">' + t('home.hero.previewEyebrow') + '</p>' +
        '<p class="mt-2 text-base font-semibold break-words text-heading">' +
        esc(highlight ? highlight.survey.title : t('home.hero.previewFallback')) + '</p>' +
        '<div class="mt-4 h-2 w-full overflow-hidden rounded-full bg-gray-200 dark:bg-gray-700"><div class="h-full w-2/3 rounded-full bg-brand-500"></div></div>' +
        '<p class="mt-2 text-xs text-muted">' + t('home.hero.previewProgress') + '</p></div></div></div>' +
        '</div></section>';

      const types =
        '<section class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8"><div class="max-w-2xl">' +
        '<p class="text-sm font-semibold tracking-wider text-brand-500 uppercase">' + t('home.types.eyebrow') + '</p>' +
        '<h2 class="mt-2 text-title-sm font-bold text-heading">' + t('home.types.title') + '</h2>' +
        '<p class="mt-3 text-muted">' + t('home.types.subtitle') + '</p></div>' +
        '<div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-5">' +
        Data.QUESTION_TYPES.map((type) =>
          '<div class="surface-card min-w-0 rounded-2xl border p-5 transition hover:shadow-theme-md">' +
          '<span class="flex h-10 w-10 items-center justify-center rounded-xl text-white" style="background-color:' + Data.QUESTION_COLOR[type] + '">' +
          icon(Data.QUESTION_ICON[type], { size: 19 }) + '</span>' +
          '<h3 class="mt-4 text-sm font-semibold text-heading">' + t('questionTypes.' + type) + '</h3>' +
          '<p class="mt-1 text-xs text-muted">' + t('questionTypeHints.' + type) + '</p></div>'
        ).join('') +
        '</div></section>';

      const steps =
        '<section class="border-y border-themed bg-gray-50 dark:bg-gray-900/40"><div class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8">' +
        '<div class="max-w-2xl"><p class="text-sm font-semibold tracking-wider text-brand-500 uppercase">' + t('home.steps.eyebrow') + '</p>' +
        '<h2 class="mt-2 text-title-sm font-bold text-heading">' + t('home.steps.title') + '</h2></div>' +
        '<ol class="mt-8 grid gap-6 lg:grid-cols-3">' +
        STEPS.map((step, i) =>
          '<li class="surface-card min-w-0 rounded-2xl border p-6">' +
          '<span class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-500 text-sm font-bold text-white">' + (i + 1) + '</span>' +
          '<h3 class="mt-4 text-base font-semibold text-heading">' + t('home.steps.' + step + '.title') + '</h3>' +
          '<p class="mt-2 text-sm text-muted">' + t('home.steps.' + step + '.desc') + '</p></li>'
        ).join('') +
        '</ol></div></section>';

      const templatesSection =
        '<section class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8">' +
        '<div class="flex flex-wrap items-end justify-between gap-4"><div class="max-w-2xl">' +
        '<p class="text-sm font-semibold tracking-wider text-brand-500 uppercase">' + t('home.templates.eyebrow') + '</p>' +
        '<h2 class="mt-2 text-title-sm font-bold text-heading">' + t('home.templates.title') + '</h2>' +
        '<p class="mt-3 text-muted">' + t('home.templates.subtitle') + '</p></div>' +
        '<a href="modelos.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-brand-600 dark:text-brand-400">' +
        t('home.templates.all') + icon('arrow-right', { size: 16 }) + '</a></div>' +
        '<div class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">' +
        templates.map((template) =>
          '<a href="modelos.html#' + encodeURIComponent(template.slug) + '" class="surface-card min-w-0 rounded-2xl border p-5 text-left transition hover:shadow-theme-md">' +
          '<span class="flex h-10 w-10 items-center justify-center rounded-xl text-white" style="background-color:' + esc(template.color) + '">' +
          icon(template.icon, { size: 19 }) + '</span>' +
          '<h3 class="mt-4 text-base font-semibold text-heading">' + esc(template.name) + '</h3>' +
          '<p class="mt-1.5 text-sm text-muted">' + esc(template.objective) + '</p>' +
          '<p class="mt-4 text-xs text-muted">' + t('templates.questionCount', { count: template.questions.length }) + '</p></a>'
        ).join('') +
        '</div></section>';

      const testimonials =
        '<section class="border-y border-themed bg-gray-50 dark:bg-gray-900/40"><div class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8">' +
        '<h2 class="text-title-sm font-bold text-heading">' + t('home.testimonials.title') + '</h2>' +
        '<div class="mt-8 grid gap-5 lg:grid-cols-3">' +
        Data.TESTIMONIALS.map((item) =>
          '<figure class="surface-card min-w-0 rounded-2xl border p-6">' +
          icon('message-circle', { size: 22, className: 'text-brand-500' }) +
          '<blockquote class="mt-4 text-sm text-body">“' + t('home.testimonials.' + item.quoteKey) + '”</blockquote>' +
          '<figcaption class="mt-5 flex items-center gap-3">' +
          UI.avatar({ src: item.avatar, name: item.name, size: 'sm' }) +
          '<span class="min-w-0"><span class="block truncate text-sm font-medium text-heading">' + esc(item.name) + '</span>' +
          '<span class="block truncate text-xs text-muted">' + esc(item.role) + '</span></span></figcaption></figure>'
        ).join('') +
        '</div></div></section>';

      const plans =
        '<section class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8"><div class="max-w-2xl">' +
        '<p class="text-sm font-semibold tracking-wider text-brand-500 uppercase">' + t('home.plans.eyebrow') + '</p>' +
        '<h2 class="mt-2 text-title-sm font-bold text-heading">' + t('home.plans.title') + '</h2>' +
        '<p class="mt-3 text-muted">' + t('home.plans.subtitle') + '</p></div>' +
        '<div class="mt-8 grid gap-6 lg:grid-cols-3">' +
        Data.PLANS_LIST.map((plan) =>
          '<div class="surface-card flex min-w-0 flex-col rounded-2xl border p-6 ' + (plan.featured ? 'border-brand-500 shadow-theme-lg' : '') + '">' +
          (plan.featured
            ? '<span class="mb-3 inline-flex w-fit rounded-full bg-brand-50 px-3 py-1 text-xs font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">' +
              t('home.plans.featured') + '</span>'
            : '') +
          '<h3 class="text-base font-semibold text-heading">' + t('home.plans.names.' + plan.id) + '</h3>' +
          '<p class="mt-3 text-title-sm font-bold text-heading">' +
          (plan.priceMonthly === 0 ? t('home.plans.free') : UI.fmt(plan.priceMonthly)) +
          (plan.priceMonthly > 0 ? '<span class="text-sm font-normal text-muted">' + t('home.plans.perMonth') + '</span>' : '') + '</p>' +
          '<p class="mt-2 text-sm text-muted">' + t('home.plans.descs.' + plan.id) + '</p>' +
          '<ul class="mt-5 flex flex-1 flex-col gap-2">' +
          plan.featureKeys.map((key) =>
            '<li class="flex items-start gap-2 text-sm text-body">' +
            icon('check', { size: 16, className: 'mt-0.5 shrink-0 text-success-500' }) +
            '<span class="min-w-0">' + t('home.plans.features.' + plan.id + '.' + key) + '</span></li>'
          ).join('') +
          '</ul>' +
          '<a href="registro.html" class="mt-6 flex h-11 items-center justify-center rounded-xl text-sm font-medium transition ' +
          (plan.featured ? 'bg-brand-500 text-white hover:bg-brand-600' : 'border border-themed text-body hover:bg-gray-50 dark:hover:bg-gray-800') +
          '">' + t('home.plans.cta') + '</a></div>'
        ).join('') +
        '</div></section>';

      const faq =
        '<section class="border-t border-themed"><div class="mx-auto max-w-3xl px-4 py-14 sm:px-6 lg:px-8">' +
        '<h2 class="text-title-sm font-bold text-heading">' + t('home.faq.title') + '</h2>' +
        '<div class="mt-8 flex flex-col gap-3">' +
        FAQ_ITEMS.map((item) => {
          const open = openFaq === item;
          return '<div class="surface-card rounded-2xl border">' +
            '<button type="button" data-faq="' + item + '" aria-expanded="' + open + '" class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left">' +
            '<span class="min-w-0 text-sm font-medium text-heading">' + t('home.faq.' + item + '.q') + '</span>' +
            icon('chevron-down', { size: 18, className: 'shrink-0 text-muted transition ' + (open ? 'rotate-180' : '') }) + '</button>' +
            (open ? '<p class="px-5 pb-5 text-sm text-muted">' + t('home.faq.' + item + '.a') + '</p>' : '') +
            '</div>';
        }).join('') +
        '</div></div></section>';

      const page = document.getElementById('page');
      page.innerHTML = hero + types + steps + templatesSection + testimonials + plans + faq;

      page.querySelectorAll('[data-faq]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-faq');
          openFaq = openFaq === key ? null : key;
          window.renderPage();
        });
      });
    };
  </script>
  <script src="assets/js/layout.js"></script>
</body>
</html>
